/* S4 — Marcadores de sinalização */
.sinalizacao-layer{
  position:absolute; inset:0; pointer-events:none; z-index:35;
}
.sinalizacao-marker{
  position:absolute; width:28px; height:28px; border-radius:50% 50% 50% 0;
  transform:translate(-50%,-100%) rotate(-45deg);
  border:3px solid #fff; box-shadow:0 2px 7px rgba(0,0,0,.28);
  cursor:pointer; pointer-events:auto;
}
.sinalizacao-marker::after{
  content:""; position:absolute; width:8px; height:8px; border-radius:50%;
  background:#fff; left:7px; top:7px;
}
.sinalizacao-marker[data-status="ATIVA"]{background:#12823b;}
.sinalizacao-marker[data-status="MANUTENCAO"]{background:#e08b00;}
.sinalizacao-marker[data-status="SUBSTITUIR"]{background:#d94841;}
.sinalizacao-marker[data-status="REMOVER"]{background:#7b1fa2;}
.sinalizacao-marker[data-status="DESATUALIZADA"]{background:#c47f00;}
.sinalizacao-marker[data-status="AUSENTE"]{background:#b42318;}
.sinalizacao-marker[data-status="INATIVA"],
.sinalizacao-marker[data-status="BAIXADA"]{background:#68717d;}

.sinalizacao-map-card{
  position:absolute; right:18px; bottom:18px; z-index:80; width:min(390px,calc(100% - 36px));
  background:#fff; border:1px solid #d9dee8; border-radius:18px; padding:16px;
  box-shadow:0 14px 36px rgba(0,0,0,.18);
}
.sinalizacao-map-card__head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sinalizacao-map-card__head div{display:flex;flex-direction:column;gap:3px}
.sinalizacao-map-card__head small{color:#6c7280}
.sinalizacao-map-card__head strong{font-size:18px}
.sig-card-close{border:0;background:#f3f5f8;border-radius:10px;width:34px;height:34px;font-size:22px;cursor:pointer}
.sig-card-badges{display:flex;gap:8px;margin:12px 0}
.sig-badge{font-size:12px;font-weight:800;padding:5px 8px;border-radius:999px;background:#171b68;color:#fff}
.sig-badge-light{background:#eef0f5;color:#202536}
.sig-card-line{margin:7px 0;color:#3d4350}
@media(max-width:700px){
 .sinalizacao-map-card{left:12px;right:12px;bottom:12px;width:auto}
}

}

/* S5A — Consulta offline */
.offline-panel{position:fixed;inset:0;z-index:300;background:rgba(17,20,52,.48);display:grid;place-items:center;padding:20px}
.offline-panel[hidden]{display:none!important}.offline-box{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.28)}

/* S5A.1 — feedback da verificação do cache */
.offline-resumo.cache-ok{border-color:#8bd3a6;background:#f1fbf5}
.offline-resumo.cache-error{border-color:#efaaa5;background:#fff5f4}

.cache-map-list{display:grid;gap:8px;margin-top:12px}
.cache-map-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid #dde1ea;border-radius:10px;background:#fff}

.cache-map-warn{border-color:#e7c36c;background:#fffaf0}

/* S6 — Outbox */
.queue-count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#171b68;color:#fff;font-size:11px;font-weight:800}

.queue-item strong{display:block}.queue-item small{color:#6b7280}
.queue-status{font-size:11px;font-weight:800;padding:4px 7px;border-radius:999px;background:#fff3cd;color:#7a5700}
.queue-status.sync{background:#e8efff;color:#173d8f}.queue-status.err{background:#fff0ef;color:#a61b16}
.sinalizacao-marker[data-status="PENDENTE"]{background:#f50087}
.sinalizacao-marker[data-status="ERRO_SYNC"]{background:#d94841}
body.offline-mode #novo{opacity:1!important;cursor:pointer!important}


/* S7 — Fotos */
.photo-section{margin:14px 0;padding:12px;border:1px solid #dde1ea;border-radius:12px;background:#fafbfe}
.photo-label{font-weight:700;display:block;margin-bottom:8px}
.photo-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.photo-btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 12px;border-radius:10px;background:#171b68;color:#fff;font-weight:700;cursor:pointer}
.photo-summary{font-size:13px;color:#656b78}
.photo-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin-top:10px}
.photo-card{position:relative;border-radius:10px;overflow:hidden;border:1px solid #dfe3ea;background:#fff;aspect-ratio:1}
.photo-card img{width:100%;height:100%;object-fit:cover;display:block}
.photo-remove{position:absolute;right:4px;top:4px;border:0;background:rgba(0,0,0,.7);color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer}
.queue-photo{font-size:12px;color:#6b7280;margin-top:5px}

/* S8 — Histórico e inspeções */
.sig-card-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sig-card-actions button{flex:1;min-width:120px}
.inspection-box form{display:grid;gap:12px;margin-top:14px}
.inspection-box form label{display:grid;gap:6px;font-weight:700}
.inspection-box select,.inspection-box input,.inspection-box textarea{width:100%;box-sizing:border-box}

.history-list{display:grid;gap:10px;margin-top:14px;max-height:60vh;overflow:auto}
.history-item{border:1px solid #dde1ea;border-radius:12px;padding:12px;background:#fff}

.history-item strong{display:block}.history-item small{color:#6b7280}

.queue-inspection{font-size:12px;color:#6b7280;margin-top:5px}
.history-item.pending{border-color:#f3b1d4;background:#fff7fb}
.history-item.pending .sig-badge{background:#f50087}

/* S11 — Central de Gestão */
.central-box{width:min(1120px,calc(100vw - 32px));max-height:92vh;overflow:auto}
.central-kpis{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:10px;margin:14px 0}

.central-result-info{font-size:13px;color:#656b78;margin:8px 0 10px}
.central-list{display:grid;gap:10px}
.central-card{border:1px solid #dde1ea;border-radius:14px;padding:14px;background:#fff}

.central-card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.central-card-title{font-size:16px;font-weight:800}

/* S12 — Dashboard Gerencial */

.dashboard-kpi span{display:block;margin-top:6px;font-size:12px;color:#656b78}

.report-page{background:#fff;padding:28px;max-width:1050px;margin:0 auto}
.report-header{border-bottom:3px solid #171b68;padding-bottom:14px;margin-bottom:18px}
.report-header h1{margin:0;font-size:28px}
.report-header p{margin:5px 0 0;color:#6b7280}
.report-section{margin:22px 0}
.report-section h2{font-size:18px;margin:0 0 10px;color:#171b68}
.report-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.report-kpi{border:1px solid #dfe3ea;border-radius:10px;padding:10px}
.report-kpi strong{display:block;font-size:22px}
.report-kpi span{font-size:11px;color:#6b7280}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.report-card{border:1px solid #dfe3ea;border-radius:10px;padding:12px}
.report-card h3{margin:0 0 8px;font-size:14px}
.report-table{width:100%;border-collapse:collapse;font-size:11px}
.report-table th,.report-table td{padding:7px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}
.report-table th{background:#f5f6f9}
.report-note{font-size:11px;color:#6b7280;margin-top:6px}
.report-summary{padding:14px;border-left:4px solid #171b68;background:#f7f8fc;border-radius:8px}
.report-badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef0f6;font-size:10px;font-weight:800}
@media(max-width:850px){
  .report-filtros{grid-template-columns:1fr 1fr}
  .report-kpis{grid-template-columns:repeat(2,1fr)}
  .report-grid{grid-template-columns:1fr}
}
@media print{
  body *{visibility:hidden!important}
  #relatoriosPanel,#relatoriosPanel *{visibility:visible!important}
  #relatoriosPanel{position:absolute!important;inset:0!important;background:#fff!important;display:block!important;overflow:visible!important}
  #relatoriosPanel .offline-box{box-shadow:none!important;border:0!important;width:auto!important;max-height:none!important;overflow:visible!important;padding:0!important}
  #relatoriosPanel .offline-head,.no-print{display:none!important}
  .report-page{max-width:none!important;padding:12mm!important}
  .report-section{break-inside:avoid}
  .report-table{font-size:9pt}
}

/* S13.1 — acabamento de impressão/PDF */
.print-hint{
  grid-column:1/-1;
  font-size:12px;
  color:#6b7280;
}
.report-header{
  display:grid;
  grid-template-columns:minmax(0,1.3fr) minmax(260px,1fr);
  gap:22px;
  align-items:end;
}
.report-header h1{
  color:#171b68;
  line-height:1.08;
  font-size:26px;
}
.report-header p{
  text-align:right;
  line-height:1.35;
}
@media print{
  @page{
    size:A4 portrait;
    margin:12mm 10mm 14mm;
  }

  html,body{
    width:210mm!important;
    background:#fff!important;
  }

  #relatoriosPanel{
    width:100%!important;
    min-height:0!important;
  }

  .report-page{
    width:auto!important;
    max-width:none!important;
    padding:0!important;
    margin:0!important;
    font-size:10pt!important;
  }

  .report-header{
    display:grid!important;
    grid-template-columns:1.15fr 1fr!important;
    gap:10mm!important;
    align-items:end!important;
    border-bottom:2px solid #171b68!important;
    padding:0 0 5mm!important;
    margin:0 0 5mm!important;
    break-after:avoid!important;
  }

  .report-header h1{
    color:#171b68!important;
    background:transparent!important;
    font-size:20pt!important;
    line-height:1.05!important;
    margin:0!important;
  }

  .report-header p{
    color:#374151!important;
    text-align:right!important;
    font-size:9pt!important;
    line-height:1.3!important;
    margin:0!important;
  }

  .report-section{
    margin:5mm 0!important;
    break-inside:auto!important;
  }

  .report-section h2{
    font-size:13pt!important;
    margin:0 0 3mm!important;
    break-after:avoid!important;
  }

  .report-summary{
    padding:3.5mm!important;
    break-inside:avoid!important;
  }

  .report-kpis{
    grid-template-columns:repeat(5,1fr)!important;
    gap:2.5mm!important;
  }

  .report-kpi{
    padding:2.5mm!important;
    min-height:14mm!important;
    break-inside:avoid!important;
  }

  .report-kpi strong{font-size:15pt!important}
  .report-kpi span{font-size:8pt!important}

  .report-grid{
    grid-template-columns:1fr 1fr!important;
    gap:3mm!important;
  }

  .report-card{
    padding:3mm!important;
    break-inside:avoid!important;
  }

  .report-table{
    width:100%!important;
    font-size:7.5pt!important;
    table-layout:auto!important;
  }

  .report-table thead{
    display:table-header-group!important;
  }

  .report-table tr{
    break-inside:avoid!important;
    page-break-inside:avoid!important;
  }

  .report-table th,.report-table td{
    padding:1.5mm 1.2mm!important;
    line-height:1.25!important;
  }

  .report-note{
    font-size:7.5pt!important;
  }

  .report-page > .report-section:nth-of-type(1),
  .report-page > .report-section:nth-of-type(2),
  .report-page > .report-section:nth-of-type(3){
    break-inside:avoid!important;
  }
}


/* S14 — Administração e Governança */
.user-badge{
  border-radius:999px!important;
  padding:7px 12px!important;
  font-size:12px!important;
  max-width:250px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.user-badge.denied{background:#fee2e2!important;color:#991b1b!important}
.admin-box{width:min(1000px,calc(100vw - 28px));max-height:94vh;overflow:auto}
.admin-session{padding:12px;border:1px solid #dde1ea;border-radius:12px;background:#f8f9fc;margin:12px 0}
.admin-tabs{display:flex;gap:8px;margin:12px 0}
.admin-toolbar{display:flex;justify-content:flex-end;margin-bottom:10px}
.admin-list{display:grid;gap:10px}
.admin-user,.admin-profile{
  border:1px solid #dde1ea;border-radius:12px;padding:12px;background:#fff;
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;
}
.admin-user.inactive{opacity:.6}
.admin-user-meta,.admin-profile-meta{font-size:12px;color:#6b7280;line-height:1.45}
.admin-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.admin-badge{display:inline-block;border-radius:999px;padding:3px 8px;background:#eef0f6;font-size:10px;font-weight:800}
.admin-editor{width:min(620px,calc(100vw - 24px))}
.admin-form{display:grid;gap:12px;margin-top:12px}
.admin-form label{display:grid;gap:5px;font-weight:700}
.admin-inline-check{display:flex!important;align-items:center;gap:8px}
.permissions-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;border:1px solid #e1e5ec;border-radius:10px}
.permissions-grid label{display:flex!important;align-items:center;gap:8px;font-weight:600!important}
.permission-denied{display:none!important}
@media(max-width:650px){
  .permissions-grid{grid-template-columns:1fr}
  .admin-user,.admin-profile{grid-template-columns:1fr}
}

.audit-filters{display:grid;grid-template-columns:2fr repeat(3,minmax(140px,1fr)) auto;gap:8px;margin:10px 0}
.audit-list{display:grid;gap:8px;max-height:58vh;overflow:auto}
.audit-item{border:1px solid #dde1ea;border-radius:12px;padding:11px;background:#fff}
.audit-item.denied{border-color:#fecaca;background:#fff7f7}.audit-item.error{border-color:#fed7aa;background:#fffaf3}
.audit-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.audit-title{font-weight:800}.audit-meta{font-size:11px;color:#6b7280;line-height:1.45;margin-top:4px}
.audit-details{margin-top:8px;padding:8px;border-radius:8px;background:#f7f8fb;font-family:ui-monospace,monospace;font-size:10px;white-space:pre-wrap;word-break:break-word}
.audit-result{padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;background:#e5e7eb}
.audit-result.SUCESSO{background:#dcfce7;color:#166534}.audit-result.NEGADO{background:#fee2e2;color:#991b1b}.audit-result.ERRO{background:#ffedd5;color:#9a3412}
@media(max-width:700px){.audit-filters{grid-template-columns:1fr 1fr}}@media(max-width:520px){.audit-filters{grid-template-columns:1fr}}

/* S16 — Backup, integridade e recuperação */
.backup-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
.backup-integrity{display:grid;gap:8px;margin:10px 0}
.integrity-summary{padding:12px;border:1px solid #dde1ea;border-radius:12px;background:#f8f9fc}

.integrity-summary.err{border-color:#fecaca;background:#fff7f7}

.integrity-item{border:1px solid #e1e5ec;border-radius:9px;padding:8px;font-size:11px;background:#fff}
.integrity-item strong{display:block}
.backup-list{display:grid;gap:9px;max-height:50vh;overflow:auto}
.backup-item{border:1px solid #dde1ea;border-radius:12px;padding:12px;background:#fff;display:grid;grid-template-columns:1fr auto;gap:10px}
.backup-meta{font-size:11px;color:#6b7280;line-height:1.45}
.backup-item-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.restore-box{width:min(760px,calc(100vw - 24px))}
.restore-sheets{display:grid;gap:7px;margin:12px 0}
.restore-sheet{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;border:1px solid #e1e5ec;border-radius:9px;padding:9px}
.restore-sheet.changed{border-color:#fde68a;background:#fffbea}
.restore-confirm{display:grid;gap:5px;font-weight:700;margin:12px 0}
.danger-btn{background:#b91c1c!important;color:#fff!important;border-color:#b91c1c!important}

/* S17 — Saúde operacional */
.health-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
.health-overall{margin-bottom:12px}
.health-banner-s17{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #dde1ea;border-radius:14px;padding:14px}
.health-banner-s17.OK{background:#f0fdf4;border-color:#bbf7d0}
.health-banner-s17.ATENCAO{background:#fffbea;border-color:#fde68a}
.health-banner-s17.CRITICO{background:#fff5f5;border-color:#fecaca}
.health-level-s17{font-size:22px;font-weight:900}
.health-grid-s17{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.health-card-s17{border:1px solid #dde1ea;border-radius:12px;padding:12px;background:#fff}

.health-alert-s17.CRITICO{background:#fff1f2;border:1px solid #fecdd3}

.health-structure-s17{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}

.health-dot-s17{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#22c55e}

@media(max-width:620px){.health-grid-s17,.health-structure-s17{grid-template-columns:1fr}}

/* S18 — Ciclo de vida e inventário */
.lifecycle-box{width:min(820px,calc(100vw - 24px));max-height:92vh;overflow:auto}
.lifecycle-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}

.agenda-actions-s19{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}

/* S22.1 — Automação */

  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:center;
  border:1px solid #dfe2ea;
  background:#f8f9fc;
  border-radius:12px;
  padding:12px;
  margin:10px 0;

/* ========================================================
   S26.9-D1 FIX1 — SCROLL INTERNO DA CENTRAL DE CATÁLOGOS
   ======================================================== */

/*
  Desktop/tablet:
  - a janela passa a ter altura efetivamente limitada;
  - cabeçalho e KPIs permanecem visíveis;
  - somente sidebar e conteúdo central rolam;
  - min-height:0 permite que os filhos do flex/grid encolham
    e que overflow-y:auto realmente entre em ação.
*/
@media (min-width:681px){
  .catalogos-box-s269c1{
    height:min(92vh,940px);
    max-height:min(92vh,940px);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .catalogos-head-s269c1,
  .catalogos-summary-s269c1{
    flex:0 0 auto;
  }

  .catalogos-layout-s269c1{
    flex:1 1 auto;
    min-height:0;
    height:auto;
    max-height:none;
    overflow:hidden;
  }

  .catalogos-sidebar-s269c1,
  .catalogos-content-s269c1{
    min-height:0;
    overflow-y:auto;
    overscroll-behavior:contain;
    scrollbar-gutter:stable;
    touch-action:pan-y;
  }

  .catalogos-content-s269c1{
    padding-bottom:28px;
  }
}

/* Notebook/tela mais baixa: usa praticamente toda a altura útil. */

  .catalogos-panel-s269c1{
    padding:10px;
  }

  .catalogos-box-s269c1{
    height:calc(100dvh - 20px);
    max-height:calc(100dvh - 20px);

    padding-top:12px;
    padding-bottom:12px;
  }

  .catalogos-summary-s269c1{

    padding-bottom:9px;
  }
}

/* Mobile mantém uma única rolagem vertical na área abaixo dos KPIs. */

    display:flex;

  }

  .catalogos-head-s269c1,
  .catalogos-summary-s269c1{

  }

  .catalogos-layout-s269c1{
    flex:1 1 auto;
    min-height:0;

    overflow-y:auto;
    overflow-x:hidden;
